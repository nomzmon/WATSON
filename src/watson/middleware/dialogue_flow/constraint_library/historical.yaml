# Historical Constraints: prevent references that conflict with the Victorian setting.
# Used by Output Validation's constraint refinement (Historical and World Boundary).
# DRAFT wording for group review. Level 1 is gentlest, level 3 strictest.
category: historical
constraints:
  - id: H-VICTORIAN-ERA
    strengths:
      - level: 1
        text: Refer only to people, places, technology and knowledge available in late nineteenth-century London.
      - level: 2
        text: Do not mention any invention, event or idea from after the 1890s.
      - level: 3
        text: If a modern idea comes up, respond as a Victorian who has never heard of it, and use only nineteenth-century knowledge.