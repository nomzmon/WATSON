[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watson"
version = "0.1.0"
description = "WATSON — an interaction-layer middleware that reduces persona drift in a Sherlock Holmes role-playing chatbot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/watson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]