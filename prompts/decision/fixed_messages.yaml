# Fixed Decision Layer replies (thesis Section 5.2.1.1), used until redirect
# generation is designed. DRAFT wording for group review. Rephrase has no fixed
# reply: the message is rewritten (rephrase.txt) and Holmes answers the rewrite.

# Redirect: steer the visitor back to the investigation, in Holmes' voice.
redirect: >-
  A diverting thought, but it brings us not one step nearer the truth of this affair.
  Let us return to the matter at hand.

# Reject: a system notice, not Holmes speaking, per Section 5.2.1.1.
reject: >-
  [System notice] This request cannot be processed in the Sherlock Holmes role-play.
  Please continue with a question about the case.