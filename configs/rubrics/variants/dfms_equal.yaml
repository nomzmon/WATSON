# criterion is weighted 0.25. Keep everything else the same as the current rubric;
# a test checks it matches. scripts/compare_weights.py reads only the weights from
# this file; a step with `rubric_variant: equal` (configs/experiments/
# weight_comparison.yaml) runs the pipeline with the whole file.

weights:
  CST: 0.25  # Conversation State Tracking
  NP: 0.25   # Narrative Progression
  CC: 0.25   # Context Continuity
  TBC: 0.25  # Topic Boundary Control

# Constraint selection. DRAFT values: the thesis does not specify them yet.
# - The current stage's dialogue-state constraint is always added.
# - If DFMS is below `guidance_below`, every criterion scoring below
#   `weak_criterion_below` adds its category's constraints (if none does, the
#   lowest criterion is used).
# - If DFMS is below `strong_below`, constraints are added at strength level 2.
# - Constraints under `always` are added to every reply at the given level, or
#   higher if a weak criterion already calls for it. CC-NO-INVENTED-EVIDENCE is
#   always on because invented evidence appeared in every run; level 2 because
#   the level-1 wording did not stop it (24 Oct 17:47, dialogue_03 turn 7).
selection:
  guidance_below: 8.0
  weak_criterion_below: 7
  strong_below: 5.0
  always:
    CC-NO-INVENTED-EVIDENCE: 2