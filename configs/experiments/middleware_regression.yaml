# Component-by-component middleware regression test (iterative refinement).
# Each step adds one middleware component to the previous step. Every step
# replays the same scripted conversations with the same seeds, so a change in
# the results comes from the added component. Add a step here each time a new
# component is built: the Output Validation Engine next.

profile: tests/fixtures/holmes_profile_sample.json  # stand-in until the knowledge-base team delivers the validated profile
dialogues: data/scenarios/scripted_dialogues
seed: 42

# DRAFT: a step regresses if the mean persona score on normal turns falls by
# more than this (1-10 scale) compared with the previous step.
regression_tolerance: 1.0

# DRAFT for group review: the decisions the Input Constraint Engine and Decision
# Layer should reach for each turn kind (thesis Section 5.2.1.1 and Table 5.2).
# Rushing turns are about the case; pacing is the Dialogue Flow Manager's job.
expected_decisions:
  normal: [accept, rephrase]
  rushing: [accept, rephrase]
  off_topic: [redirect]
  anachronism: [reject]
  persona_breaking: [reject]

steps:
  - name: persona prompt only
    template: prompts/generation/baseline_persona.txt
    modules: {}

  - name: + input constraint and decision layer
    template: prompts/generation/baseline_persona.txt
    modules:
      input_constraint: true
      decision_layer: true

  # Prompt Builder's structured prompt: adds the case details, the stage and a
  # guidance section. Without the Dialogue Flow Manager the stage reads "not yet
  # tracked" and there is no guidance, so this step isolates the case context.
  - name: + structured prompt (case context)
    template: prompts/generation/structured_prompt.txt
    modules:
      input_constraint: true
      decision_layer: true

  - name: + dialogue flow manager
    template: prompts/generation/structured_prompt.txt
    modules:
      input_constraint: true
      decision_layer: true
      dialogue_flow: true